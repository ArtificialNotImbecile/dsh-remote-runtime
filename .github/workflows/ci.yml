name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  package:
    name: Package (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22.19.0, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run typecheck
      - run: pnpm run test
      - run: pnpm run build
      - run: pnpm run pack:check

  assembled-web-profile:
    name: Assembled DSH rc.8 Web profile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run build
      - name: Pack plugin
        run: pnpm pack --pack-destination "$RUNNER_TEMP"
      - name: Install bundle into an isolated Harness profile
        env:
          DSH_HOME: ${{ runner.temp }}/dsh-remote-runtime-profile
        run: |
          package=$(find "$RUNNER_TEMP" -maxdepth 1 -name 'artificialnotimbecile-dsh-remote-runtime-*.tgz' -print -quit)
          test -n "$package"
          pnpm dlx @deepseek-ai/dsh@0.1.0-rc.8 plugin --profile web add "$package"
          pnpm dlx @deepseek-ai/dsh@0.1.0-rc.8 --profile web --dump-config > "$RUNNER_TEMP/dsh-config.yml"
          grep -F "@artificialnotimbecile/dsh-remote-runtime" "$RUNNER_TEMP/dsh-config.yml"
          DSH_PLUGIN_TARBALL="$package" pnpm run test:dsh-install
